[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "fastmcp>=4.1.6",
    "langchain-anthropic>=1.7.10",
    "langchain[mcp]>=1.4.9",
    "uuid>=1.30",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
